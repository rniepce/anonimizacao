<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
        }

        h2 {
            margin-top: 0;
            color: #3498db;
            font-size: 16px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background-color: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: white;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #27ae60;
            text-align: center;
            height: 15px;
        }

        .info {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <h2>TJMG Anonimizador</h2>

    <label for="apiUrl">URL da API (Backend):</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:8000">

    <button id="saveBtn">Salvar Configuração</button>
    <div id="status"></div>

    <div class="info">
        Clique no ícone flutuante 🛡️ nas páginas do PJe/Eproc ou clique com botão direito em links de PDF.
    </div>

    <script src="popup.js"></script>
</body>

</html>
